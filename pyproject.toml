[project]
name = "seo-analytics-mcp"
version = "0.1.0"
description = "MCP server for Google Search Console, GA4 and IndexNow"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "seo-analytics-mcp contributors" }]
keywords = ["mcp", "seo", "search-console", "ga4", "analytics", "indexnow", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "mcp[cli]>=2.1,<3",            # v2 renamed FastMCP -> MCPServer; pin the floor and the ceiling
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
  "google-analytics-data>=0.18",
  "google-analytics-admin>=0.22",
  "httpx>=0.27",
  "typing-extensions>=4.7 ; python_version < '3.11'",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
http = ["uvicorn>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "vcrpy>=6", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/zainsive/seo-analytics-mcp"
Issues = "https://github.com/zainsive/seo-analytics-mcp/issues"
Changelog = "https://github.com/zainsive/seo-analytics-mcp/blob/main/CHANGELOG.md"

[project.scripts]
seo-analytics-mcp = "seo_mcp.cli:main"   # this is what makes `uvx seo-analytics-mcp` work with no install
seo-mcp = "seo_mcp.cli:main"        # short alias, kept so existing client configs keep working

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
